name: Daily SEO Intel Generator

on:
  schedule:
    # Runs automatically every midnight UTC (7 PM Central Time)
    - cron: '0 0 * * *'
  # Allows you to click a button to test it manually whenever you want
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO Briefing Generator
        run: python scripts/generate_seo_briefings.py

      - name: Commit and push new briefing
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add briefings/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily SEO briefing [skip ci]" && git push)
