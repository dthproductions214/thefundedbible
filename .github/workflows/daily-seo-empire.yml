name: Daily Automated SEO Empire Builder

on:
  schedule:
    # Runs automatically every day at 13:00 UTC (08:00 AM EST before NY Market Open)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Programmatic SEO Generator
        run: python auto_seo_engine.py

      - name: Commit & Push New SEO Pages to Main (Triggers Vercel Live Deploy)
        run: |
          git config user.name "Danny Hoang (Automated SEO Desk)"
          git config user.email "dthproductions214@users.noreply.github.com"
          git add *.html sitemap.xml
          if git diff --staged --quiet; then
            echo "No new changes today."
          else
            git commit -m "Automated Daily SEO Desk Deployment: $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi