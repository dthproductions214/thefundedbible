name: Autonomous SEO Content Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install google-generativeai
      - name: Run SEO Content Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python seo_content_bot.py
          python fix_site.py
      - name: Commit and Push New Article
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SEO Automation Bot"
          git add .
          git commit -m "Auto-generated daily SEO content and updated sitemap" || echo "No changes to commit"
          git push
